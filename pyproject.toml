[project]
name = "hale-blog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hhale1113", email = "hal23031@byui.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "lets-plot>=4.10.1",
    "polars[async,database,excel,fsspec,graph,numpy,plot,pyarrow,style,timezone]>=1.41.2",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
